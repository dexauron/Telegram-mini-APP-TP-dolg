name: Тесты

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  database:
    name: База данных и машина состояний
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Поставить PostgreSQL 16
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 postgresql-client-16
          sudo systemctl stop postgresql || true

      # Скрипт поднимает собственный временный кластер и накатывает миграции.
      - name: Прогнать миграции и сквозной тест
        run: PGBIN=/usr/lib/postgresql/16/bin supabase/tests/run.sh

  shared:
    name: Разбор сообщений, форматирование, подпись
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: supabase/functions/_shared/run-tests.sh

  web:
    name: Интерфейс в браузере
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
